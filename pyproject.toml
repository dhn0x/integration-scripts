[project]
name = "threat-hunting-automation"
version = "0.1.0"
description = "Threat hunting model automation for FortiSIEM"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Integration Scripts" }]
license = { text = "MIT" }
dependencies = ["requests>=2.31.0"]

[project.scripts]
fortisiem-hunt = "threat_hunting.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
